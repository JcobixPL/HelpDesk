services:
  postgres:
    image: postgres:18
    container_name: helpdesk-postgres
    environment:
      POSTGRES_DB: HelpDeskDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - helpdesk-postgres-data:/var/lib/postgresql

volumes:
  helpdesk-postgres-data: